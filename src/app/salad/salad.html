<p>Welcome {{ name() }} ! choose your toppings below :</p>

<div class="toppings-lists">
  <app-toppings
    [toppings]="toppings()"
    buttonLabel="+1"
    placeholderLabel="Loading toppings..."
    (clickTopping)="chooseTopping($event)"
  ></app-toppings>

  <div>
    <p data-test="total-price">Total price : {{ totalPrice() | currency: '€' }}</p>
    <app-toppings
      [toppings]="chosenToppings()"
      buttonLabel="-1"
      placeholderLabel="No ingredients chosen. Add some!"
      (clickTopping)="removeTopping($event)"
    ></app-toppings>
  </div>
</div>
