<p>Welcome {{ orderService.name() }} ! choose your toppings below :</p>

<div class="toppings-lists">
  <app-toppings
    [toppings]="toppings()"
    buttonLabel="+1"
    placeholderLabel="Loading toppings..."
    (clickTopping)="saladService.chooseTopping($event)"
  ></app-toppings>

  <div>
    <p>Total price : {{ saladService.totalPrice() | currency: '€' }}</p>
    <app-toppings
      [toppings]="saladService.chosenToppings()"
      buttonLabel="-1"
      placeholderLabel="No ingredients chosen. Add some!"
      (clickTopping)="saladService.removeTopping($event.id)"
    ></app-toppings>
  </div>
</div>
