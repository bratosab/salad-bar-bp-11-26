<form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="fill">
    <mat-label>What is your name ?</mat-label>
    <input matInput type="text" formControlName="name" />
    <mat-error>Vous ne passerez pas !</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>What is your tel ?</mat-label>
    <input matInput type="text" formControlName="tel" />
    @if(orderForm.controls.tel.hasError('required')) {
    <mat-error>Pas de numéro, pas de salad !</mat-error>
    } @else {
    <mat-error>J'ai besoins de ton vrai numéro !</mat-error>
    }
  </mat-form-field>

  <button type="submit" matButton="outlined">Build my salad !</button>
</form>
