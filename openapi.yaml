openapi: 3.0.3
info:
  title: Salad Bar API
  description: API used by the Salad Bar app to fetch available salad toppings.
  version: 1.0.0
servers:
  - url: https://retoolapi.dev/XDaOzA
paths:
  /toppings:
    get:
      operationId: getToppings
      summary: List all toppings
      tags:
        - Toppings
      responses:
        '200':
          description: The list of available toppings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Topping'
components:
  schemas:
    Topping:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Tomato
        price:
          type: number
          format: double
          example: 0.5
